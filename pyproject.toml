[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-shapes-generator"
version = "0.1.0"
description = "Generate synthetic images containing random geometric shapes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "docs/LICENSING.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "Pillow>=9.5"]

[project.optional-dependencies]
dataset = ["torch>=2.2", "torchvision>=0.17"]
notebook = ["jupyterlab>=4", "ipywidgets>=8"]

[project.scripts]
generate-shapes = "geometric_shapes_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
